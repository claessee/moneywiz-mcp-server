name: Release Artifacts

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12.15"
  RELEASE_TAG: ${{ github.event.release.tag_name }}

jobs:
  build-release-artifacts:
    name: Build and Upload Release Artifacts
    runs-on: ubuntu-latest
    if: startsWith(github.event.release.tag_name, 'v')
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Check locked environment
        run: |
          uv lock --check
          uv sync --frozen --all-extras

      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION=$(uv run --frozen python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          TAG_VERSION="${RELEASE_TAG#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Package version $PACKAGE_VERSION does not match release tag $RELEASE_TAG"
            exit 1
          fi

      - name: Build package artifacts
        run: uv build --no-sources

      - name: Check package artifacts
        run: uv run --frozen twine check dist/*

      - name: Upload artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/*

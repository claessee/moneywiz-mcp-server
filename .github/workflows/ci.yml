name: Read-only correctness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ['3.10', '3.12.15', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --all-extras --python '${{ matrix.python }}'
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy src/
      - run: uv run --frozen bandit -r src/ -q
      - run: uv run --frozen pytest
      - run: uv run --frozen python scripts/check_critical_coverage.py
      - run: uv build --no-sources
      - run: uv run --frozen twine check dist/*

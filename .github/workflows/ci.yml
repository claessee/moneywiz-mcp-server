name: Read-only correctness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ['3.10', '3.12.15', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: ${{ matrix.python }}
      - run: uv lock --check
      - run: uv sync --frozen --all-extras --python '${{ matrix.python }}'
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy src/
      - run: uv run --frozen bandit -r src/ -q
      - run: uv run --frozen pytest
      - run: uv run --frozen python scripts/check_critical_coverage.py
      - run: uv build --no-sources
      - run: uv run --frozen twine check dist/*

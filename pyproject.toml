[build-system]
requires = ["setuptools==82.0.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "moneywiz-mcp-server"
version = "2.0.0"
description = "Unofficial, permanently read-only MCP v2 server for local MoneyWiz data on macOS"
authors = [
    {name = "Juan Carlos Valerio Arrieta", email = "jcvalerio@gmail.com"}
]
maintainers = [
    {name = "claessee"}
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = [
    "ai",
    "analytics",
    "finance",
    "macos",
    "mcp",
    "model-context-protocol",
    "moneywiz",
    "personal-finance",
    "read-only",
    "sqlite",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "mcp==2.3.0",
    "aiosqlite==0.22.1",
    "pydantic==2.13.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3", "pytest-asyncio==1.3.0", "pytest-cov==7.1.0",
    "coverage[toml]==7.14.0", "ruff==0.15.12", "mypy==2.0.0",
    "bandit==1.9.4", "build==1.6.1", "twine==7.0.0", "pip-audit==2.10.1",
]

[project.scripts]
moneywiz-mcp-server = "moneywiz_mcp_server.main:cli_main"
moneywiz-validate = "moneywiz_mcp_server.validate:main"

[project.urls]
"Homepage" = "https://github.com/claessee/moneywiz-mcp-server"
"Documentation" = "https://github.com/claessee/moneywiz-mcp-server#readme"
"Changelog" = "https://github.com/claessee/moneywiz-mcp-server/blob/main/CHANGELOG.md"
"Bug Reports" = "https://github.com/claessee/moneywiz-mcp-server/issues"
"Source" = "https://github.com/claessee/moneywiz-mcp-server"
"Upstream" = "https://github.com/jcvalerio/moneywiz-mcp-server"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

# Testing configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=moneywiz_mcp_server",
    "--cov-report=term-missing",

    "--cov-report=xml",
    "--cov-fail-under=85",  # Full production surface plus critical regression suite
]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Ruff configuration (modern linter + formatter)
[tool.ruff]
target-version = "py310"
line-length = 88
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG001", # unused arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "TID",    # flake8-tidy-imports
    "Q",      # flake8-quotes
    "PGH",    # pygrep-hooks
    "PIE",    # flake8-pie
    "PL",     # pylint
    "PT",     # flake8-pytest-style
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "PD",     # pandas-vet
    "PYI",    # flake8-pyi
    "NPY",    # numpy
    "PERF",   # perflint
    "RUF",    # ruff-specific rules
]
ignore = [
    "PLR0913", # too many arguments
    "PLR0912", # too many branches
    "PLR0915", # too many statements
    "PLR2004", # magic value comparison
    "PT011",   # pytest-raises-too-broad
    "E501",    # long explicit tool descriptions and SQL lines
    "PLC0415", # imports local to entry-point/testing setup
    "PLW0603", # process-local startup configuration

]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["PLR2004", "S101", "TID252", "PLC0415", "E501"]
"scripts/**/*" = ["T201", "S603", "S607"]  # Allow print, subprocess calls
"**/test_*.py" = ["PLC0415", "E501", "ARG001"]
"continue-development.py" = ["PLC0415"]
"analyze_schema.py" = ["PLC0415"]
"setup_env.py" = ["PLC0415"]
"test_mcp_*.py" = ["PLC0415", "E501", "ARG001"]

[tool.ruff.lint.isort]
known-first-party = ["moneywiz_mcp_server"]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Type checking
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
show_column_numbers = true
pretty = true
mypy_path = "src"

# Bandit security configuration
[tool.bandit]
exclude_dirs = ["tests", "scripts"]
# Use the exact locked local tools; no second environment with weaker type checks.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: uv run --frozen ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run --frozen ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: Strict mypy
        entry: uv run --frozen mypy src/
        language: system
        pass_filenames: false
        types: [python]
      - id: bandit
        name: Full Bandit
        entry: uv run --frozen bandit -r src/ -q
        language: system
        pass_filenames: false
        types: [python]
